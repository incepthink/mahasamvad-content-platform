# Production stack for the DGIPR platform on a single EC2 host.
#
#   api    — @dgipr/api (Fastify + Chromium), built from deploy/api.Dockerfile
#   n8n    — the social-post workflow host
#   caddy  — reverse proxy with automatic HTTPS (Let's Encrypt) for both above
#
# The web app is NOT here — it runs on Vercel and calls `api` over public HTTPS.
# Supabase is managed cloud (your existing project); nothing to run for it here.
#
# Bring it up from this directory:  docker compose pull && docker compose up -d
# (`--build` is NOT part of a deploy here — the api image is built off the box and
#  pulled; see the note on the api service below and deploy/README.md.)
#
# Prereqs on the box:
#   - Docker + Docker Compose plugin installed
#   - deploy/.env.prod filled in (see .env.prod.example)
#   - `docker login ghcr.io` (or a public package) so the api image can be pulled
#   - DNS A-records: api.<domain> and n8n.<domain> -> this EC2's public IP
#   - Security group inbound: 80 + 443 open to the world; 22 to your IP only

services:
  api:
    # The image is built OFF the box (laptop or CI) and pulled here — building on an
    # EC2 box that also runs n8n means a pnpm install + monorepo build + a ~500 MB
    # Chromium install competing for its RAM, every deploy. See deploy/README.md
    # "Update the API".
    #
    # API_TAG comes from deploy/.env (the same file that carries N8N_SUBDOMAIN) and
    # defaults to `latest`. Pin it to a git SHA there to roll back: set the value, then
    # `docker compose up -d api`.
    #
    # `build:` is KEPT so `docker compose build api` still works locally — but note the
    # consequence on the box: if `docker compose pull api` fails and the image is absent,
    # `up -d` will BUILD it here rather than error. Always check the pull succeeded.
    image: ghcr.io/incepthink/dgipr-api:${API_TAG:-latest}
    build:
      context: ..                      # repo root — the monorepo build needs it
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod                      # Supabase + OpenAI + n8n wiring (see template)
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      # api <-> n8n talk over the internal compose network by service name:
      N8N_SOCIAL_POST_WEBHOOK_URL: http://n8n:5678/webhook/dgipr-social-post
      N8N_ARTICLE_POSTER_WEBHOOK_URL: http://n8n:5678/webhook/dgipr-article-poster
      API_PUBLIC_URL: http://api:3001  # the URL n8n pings for job progress
      # ARTICLE_POSTER_MODE defaults to 'n8n' (render via the workflow above); set to
      # 'html' to fall back to the in-container HTML/Playwright renderer.
    expose:
      - "3001"                         # internal only; Caddy publishes it
    # No host port mapping — Caddy is the only public entrypoint.

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      # Public-facing identity (Caddy terminates TLS in front of it):
      N8N_HOST: ${N8N_SUBDOMAIN:?set N8N_SUBDOMAIN in shell or compose env}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${N8N_SUBDOMAIN}/
      N8N_EDITOR_BASE_URL: https://${N8N_SUBDOMAIN}/
      GENERIC_TIMEZONE: Asia/Kolkata
      # Lock the editor down with basic auth (change the password!):
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?set a real n8n admin password}
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n       # persists workflows, credentials, encryption key

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data               # ACME certs — MUST persist across restarts
      - caddy_config:/config
    depends_on:
      - api
      - n8n

  # PostgREST — the database API. This is what SUPABASE_URL now points at.
  #
  # It is the SAME software Supabase runs in front of its Postgres, which is the
  # whole point: @supabase/supabase-js speaks PostgREST's wire protocol, so all
  # 56 queries in packages/database keep working with no code change. See the
  # 2026-08-09 database migration milestone in AGENTS.md.
  #
  # Never publish this. It has no rate limiting and its JWT grants BYPASSRLS —
  # it is reachable only over the internal compose network, by `api`.
  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    env_file:
      - .env.prod                      # PGRST_DB_URI + PGRST_JWT_SECRET live here
    environment:
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon         # unauthenticated role; granted nothing
      PGRST_SERVER_PORT: "3000"
      PGRST_DB_POOL: "10"              # api is single-process; 10 is ample
    expose:
      - "3000"                         # internal only — no host port, no Caddy route

  # Path-strip sidecar. supabase-js hardcodes a `/rest/v1` prefix onto every
  # request; PostgREST serves at the root. This strips it.
  #
  # It is a SEPARATE container rather than a route in the public Caddyfile on
  # purpose: that file terminates TLS for api.indicex.xyz and n8n.indicex.xyz,
  # and a syntax error in it would take the public site down. Nothing in this
  # migration touches it.
  pgrst-proxy:
    image: caddy:2                     # already on the box — no new image to pull
    restart: unless-stopped
    volumes:
      - ./pgrst-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "8000"
    depends_on:
      - postgrest

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
